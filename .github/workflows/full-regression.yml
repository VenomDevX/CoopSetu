name: Full Regression Suite

# Runs nightly and on-demand — NOT on every PR/push, since it boots a full
# local Supabase stack plus the entire Playwright suite (every spec, not just
# the smoke set in ci.yml) and takes meaningfully longer. ci.yml's PR-time
# jobs (integration-tests, e2e-smoke) remain the fast safety net for every
# push; this workflow catches anything they don't within a day, or on demand.
on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  workflow_dispatch: {}

permissions: read-all

jobs:
  full-secret-scan:
    name: Full-History Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog (full history, not just verified)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # Binary face-api weight shards: random bytes in them match the Wit
          # token pattern (unverified false positives), failing every nightly.
          extra_args: --debug --exclude-paths=.github/trufflehog-exclude.txt

  full-regression:
    name: Full Playwright + Responsive + Role Matrices + Realtime + Reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Log in to GHCR
        # supabase start pulls ~12 images from ghcr.io; anonymous pulls from
        # shared runners get throttled ("toomanyrequests"), which failed the
        # job before any test ran. Authenticated pulls avoid that limit.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start local Supabase
        # Skip services nothing here uses (no edge functions; Studio, logging,
        # image proxy and pooler are dev tooling) to pull fewer images, and
        # retry. setup-cli points the CLI at ghcr.io, which throttles the whole
        # shared-runner pool even for logged-in pulls, so retries fall back to
        # the same images on AWS ECR Public, which has separate limits.
        run: |
          attempt=0
          for registry in ghcr.io public.ecr.aws public.ecr.aws; do
            attempt=$((attempt + 1))
            echo "supabase start: attempt $attempt/3 via $registry"
            SUPABASE_INTERNAL_IMAGE_REGISTRY=$registry supabase start -x edge-runtime,imgproxy,vector,logflare,studio,supavisor && exit 0
            supabase stop --no-backup || true
            sleep 20
          done
          exit 1

      - name: Apply migrations and seed
        run: supabase db reset

      - name: Export local Supabase env vars
        # -o env quotes every value; $GITHUB_ENV treats quotes as literal
        # characters, so strip them before appending.
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SECRET_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY|SUPABASE_SECRET_KEY)=' \
            | sed 's/="\(.*\)"$/=\1/' >> "$GITHUB_ENV"

      # Covers cross-org isolation, private-task-visibility, student-team
      # role/permission matrices, and export/report generation
      # (tests/integration/group-a-actions.test.ts) in one command.
      - name: Run full unit + integration suite
        run: npm run test:all
        env:
          TEST_USER_PASSWORD: "Password123!"
          ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

      - name: Verify realtime (task + notification live delivery)
        run: node scripts/verify-realtime.mjs
        env:
          TEST_USER_PASSWORD: "Password123!"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Every spec — onboarding, student-team, responsive (full 5-viewport
      # matrix), smoke — not just the PR-time smoke subset.
      - name: Run full Playwright suite
        run: npx playwright test
        env:
          TEST_USER_PASSWORD: "Password123!"
          ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-report
          path: playwright-report/
          retention-days: 14
